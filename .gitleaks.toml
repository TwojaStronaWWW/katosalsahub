title = "Kato Salsa Hub & DancePuls - Gitleaks Security Configuration (ISO 27001)"

[extend]
useDefault = true

[[rules]]
id = "osticket-api-key"
description = "Wykryto zahardkodowany klucz API osTicket"
regex = '''(?i)(?:X-API-Key|OSTICKET_API_KEY)\s*[:=]\s*['"]?[A-Z0-9]{24,40}['"]?'''
tags = ["key", "osticket", "security"]

[[rules]]
id = "hardcoded-admin-password"
description = "Wykryto zahardkodowane hasło administratora Salsopedii"
regex = '''katoAdmin202[0-9]'''
tags = ["password", "salsopedia", "security"]

[allowlist]
description = "Wykluczenie szablonów przykładowych, publicznego pliku weryfikacji IndexNow i testów jednostkowych"
paths = [
  '''^\.?env\.example$''',
  '''^\.?gitleaks\.toml$''',
  '''^tests/.*''',
  '''^\.git/.*'''
]
regexes = [
  '''4f8b9d2e7a1c6f3b5e0d8a9c2b4f7e1a'''
]
