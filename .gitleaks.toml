title = "Kato Salsa Hub & DancePuls - Gitleaks Security Configuration (ISO 27001)"

[extend]
useDefault = true

[[rules]]
id = "osticket-api-key"
description = "Wykryto zahardkodowany klucz API osTicket"
regex = '''(?i)(?:X-API-Key|OSTICKET_API_KEY)\s*[:=]\s*['"]?[A-Z0-9]{24,40}['"]?'''
tags = ["key", "osticket", "security"]

[[rules]]
id = "hardcoded-admin-password"
description = "Wykryto zahardkodowane hasło administratora Salsopedii"
regex = '''katoAdmin202[0-9]'''
tags = ["password", "salsopedia", "security"]

[[rules]]
id = "hardcoded-password-hash"
description = "Wykryto zahardkodowany hash hasła (PBKDF2 / bcrypt / Argon2) w kodzie źródłowym"
regex = '''(?:pbkdf2\$[0-9]+\$[a-fA-F0-9]{16,}\$[a-fA-F0-9]{32,}|\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}|\$argon2(?:id|i|d)\$v=[0-9]+\$)'''
tags = ["hash", "password", "security"]

[[rules]]
id = "ntfy-bearer-token"
description = "Wykryto zahardkodowany token dostępowy Ntfy"
regex = '''tk_[a-zA-Z0-9]{20,}'''
tags = ["token", "ntfy", "security"]

[allowlist]
description = "Wykluczenie szablonów przykładowych, publicznego pliku weryfikacji IndexNow, publicznych linków do albumów Google Photos i testów jednostkowych"
regexTarget = "line"
paths = [
  '''^\.?env\.example$''',
  '''^\.?gitleaks\.toml$''',
  '''^tests/.*''',
  '''^docs/audits/.*''',
  '''^docs/print/.*''',
  '''^\.git/.*'''
]
regexes = [
  '''4f8b9d2e7a1c6f3b5e0d8a9c2b4f7e1a''',
  '''photos\.google\.com/share/[A-Za-z0-9_-]+\?key=[A-Za-z0-9_-]+''',
  '''Z2wxa3F5djRXSlhoSkxYSlRMMDVnN0tfS1BMaU1n''',
  '''Y2JvWkpuZ0FTOUx3QnJPN3lxdWJfaUJHNVE1Q3NR''',
  '''Ry1JbWZlVzR5WFBROWhlbHZxU19GX3R2ZkFsQXN3'''
]
