name: CD — Deploy to LH
on:
  workflow_run:
    workflows: ["CI & Quality Gate"]
    types: [completed]
    branches: [ "main", "staging" ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  backup:
    name: 💾 Backup serwera (LH.pl)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      MAIN_PATH: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'katosalsahub.pl' || 'staging.katosalsahub.pl' }}
      DANCE_PATH: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'dancepuls.katosalsahub.pl' || 'staging.katosalsahub.pl/dancepuls' }}
    steps:
      - name: Pobierz aktualną wersję z serwera przez SFTP
        run: |
          sudo apt-get install -y -qq lftp > /dev/null 2>&1
          mkdir -p backup/katosalsahub backup/dancepuls
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" \
            -p 40022 \
            sftp://${{ secrets.FTP_SERVER }} \
            -e "
              set net:timeout 15;
              set net:max-retries 2;
              set net:reconnect-interval-base 3;
              set sftp:auto-confirm yes;
              mirror --parallel=4 --verbose /home/platne/serwer417204/public_html/${{ env.MAIN_PATH }} ./backup/katosalsahub || true;
              mirror --parallel=4 --verbose /home/platne/serwer417204/public_html/${{ env.DANCE_PATH }} ./backup/dancepuls || true;
              quit
            "

      - name: Zapisz backup jako artefakt
        uses: actions/upload-artifact@v7
        with:
          name: backup-${{ env.TARGET_BRANCH }}-${{ github.run_number }}
          path: backup/
          retention-days: 7

  deploy:
    name: 🚀 Deploy na serwer (${{ github.event.workflow_run.head_branch || github.ref_name }})
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      MAIN_PATH: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'katosalsahub.pl' || 'staging.katosalsahub.pl' }}
      DANCE_PATH: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'dancepuls.katosalsahub.pl' || 'staging.katosalsahub.pl/dancepuls' }}
    steps:
      - name: Checkout zwalidowanego commita (head_sha)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Upload via SFTP (lftp)
        run: |
          sudo apt-get install -y -qq lftp > /dev/null 2>&1
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" \
            -p 40022 \
            sftp://${{ secrets.FTP_SERVER }} \
            -e "
              set net:timeout 20;
              set net:max-retries 3;
              set net:reconnect-interval-base 3;
              set sftp:auto-confirm yes;
              mirror -R --parallel=4 --verbose --exclude-glob assets/data/pending_edits.json --exclude-glob assets/data/moderators.json --exclude-glob assets/data/login_attempts.json --exclude-glob assets/data/*.bak --exclude-glob assets/php/rate_limits/rate_*.json ./katosalsahub.pl /home/platne/serwer417204/public_html/${{ env.MAIN_PATH }};
              mirror -R --parallel=4 --verbose --exclude-glob data/*.bak --exclude-glob data/*.tmp ./dancepuls.pl /home/platne/serwer417204/public_html/${{ env.DANCE_PATH }};
              quit
            "

      - name: Cloudflare Purge Cache (Edge Invalidation)
        if: env.TARGET_BRANCH == 'main'
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_ZONE" ] && [ -n "$CF_TOKEN" ]; then
            echo "⚡ Czyszczenie pamięci podręcznej Cloudflare CDN..."
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}'
          else
            echo "ℹ️ Pominięto Cloudflare Purge Cache (brak sekretów CLOUDFLARE_ZONE_ID / CLOUDFLARE_API_TOKEN)."
          fi

      - name: Czyszczenie starych artefaktów backupów (max 2 ostatnie)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Czyszczenie starych artefaktów backup-${{ env.TARGET_BRANCH }}-* (pozostawianie 2 najnowszych)..."
          OLD_IDS=$(gh api "repos/${{ github.repository }}/actions/artifacts" \
            --jq '.artifacts | map(select(.name | startswith("backup-${{ env.TARGET_BRANCH }}-") and (.expired == false))) | sort_by(.created_at) | reverse | .[2:] | .[].id' || true)
          for id in $OLD_IDS; do
            echo "Usuwanie przestarzałego artefaktu backupu ID: $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done
