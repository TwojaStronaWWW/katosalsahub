name: CI + Deploy to LH
on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: 🧪 Quality Gate & Testy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Uruchomienie pełnego Quality Gate (składnia + testy jednostkowe)
        run: npm run check

      - name: Walidacja HTML (opcjonalna)
        run: |
          npm install -g htmlhint
          for file in katosalsahub.pl/*.html dancepuls.pl/*.html; do
            [ -f "$file" ] || continue
            if head -5 "$file" | grep -qi 'doctype'; then
              echo "✅ Walidacja: $file"
              htmlhint "$file" --config .htmlhintrc || true
            else
              echo "⏭️ Pomijam partial: $file"
            fi
          done

      - name: Sprawdzanie referencji lokalnych linków i zasobów
        run: |
          for dir in katosalsahub.pl dancepuls.pl; do
            echo "🔍 Sprawdzanie referencji w $dir..."
            for html_file in $dir/*.html; do
              [ -f "$html_file" ] || continue
              base=$(dirname "$html_file")
              grep -oP '(?:src|href)="(?!https?://|#|javascript:|mailto:|tel:)([^"]+)"' "$html_file" | \
              sed 's/.*="\(.*\)"/\1/' | sed 's/[?#].*//' | \
              while read -r ref; do
                [ -z "$ref" ] && continue
                if [ ! -f "$base/$ref" ] && [ ! -d "$base/$ref" ]; then
                  echo "❌ BRAK ZASOBU: $html_file → $ref"
                  exit 1
                fi
              done
            done
          done
          echo "✅ Sprawdzanie referencji zakończone pomyślnie."

  backup:
    name: 💾 Backup serwera (LH.pl)
    needs: quality-gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MAIN_PATH: ${{ github.ref_name == 'main' && 'katosalsahub.pl' || 'staging.katosalsahub.pl' }}
      DANCE_PATH: ${{ github.ref_name == 'main' && 'dancepuls.katosalsahub.pl' || 'staging.katosalsahub.pl/dancepuls' }}
    steps:
      - name: Pobierz aktualną wersję z serwera przez SFTP
        run: |
          sudo apt-get install -y -qq lftp > /dev/null 2>&1
          mkdir -p backup/katosalsahub backup/dancepuls
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" \
            -p 40022 \
            sftp://${{ secrets.FTP_SERVER }} \
            -e "
              set net:timeout 15;
              set net:max-retries 2;
              set net:reconnect-interval-base 3;
              set sftp:auto-confirm yes;
              mirror --parallel=4 --verbose /home/platne/serwer417204/public_html/${{ env.MAIN_PATH }} ./backup/katosalsahub || true;
              mirror --parallel=4 --verbose /home/platne/serwer417204/public_html/${{ env.DANCE_PATH }} ./backup/dancepuls || true;
              quit
            "

      - name: Zapisz backup jako artefakt
        uses: actions/upload-artifact@v7
        with:
          name: backup-${{ github.ref_name }}-${{ github.run_number }}
          path: backup/
          retention-days: 7

  deploy:
    name: 🚀 Deploy na serwer (${{ github.ref_name }})
    needs: backup
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      MAIN_PATH: ${{ github.ref_name == 'main' && 'katosalsahub.pl' || 'staging.katosalsahub.pl' }}
      DANCE_PATH: ${{ github.ref_name == 'main' && 'dancepuls.katosalsahub.pl' || 'staging.katosalsahub.pl/dancepuls' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Upload via SFTP (lftp)
        run: |
          sudo apt-get install -y -qq lftp > /dev/null 2>&1
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" \
            -p 40022 \
            sftp://${{ secrets.FTP_SERVER }} \
            -e "
              set net:timeout 20;
              set net:max-retries 3;
              set net:reconnect-interval-base 3;
              set sftp:auto-confirm yes;
              mirror -R --parallel=4 --verbose --exclude-glob assets/data/pending_edits.json --exclude-glob assets/data/moderators.json --exclude-glob assets/data/login_attempts.json --exclude-glob assets/data/*.bak --exclude-glob assets/php/rate_limits/rate_*.json ./katosalsahub.pl /home/platne/serwer417204/public_html/${{ env.MAIN_PATH }};
              mirror -R --parallel=4 --verbose --exclude-glob data/*.bak --exclude-glob data/*.tmp ./dancepuls.pl /home/platne/serwer417204/public_html/${{ env.DANCE_PATH }};
              quit
            "

      - name: Cloudflare Purge Cache (Edge Invalidation)
        if: github.ref_name == 'main'
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_ZONE" ] && [ -n "$CF_TOKEN" ]; then
            echo "⚡ Czyszczenie pamięci podręcznej Cloudflare CDN..."
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}'
          else
            echo "ℹ️ Pominięto Cloudflare Purge Cache (brak sekretów CLOUDFLARE_ZONE_ID / CLOUDFLARE_API_TOKEN)."
          fi

      - name: Czyszczenie starych artefaktów backupów (max 2 ostatnie)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Czyszczenie starych artefaktów backup-${{ github.ref_name }}-* (pozostawianie 2 najnowszych)..."
          OLD_IDS=$(gh api "repos/${{ github.repository }}/actions/artifacts" \
            --jq '.artifacts | map(select(.name | startswith("backup-${{ github.ref_name }}-") and (.expired == false))) | sort_by(.created_at) | reverse | .[2:] | .[].id' || true)
          for id in $OLD_IDS; do
            echo "Usuwanie przestarzałego artefaktu backupu ID: $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done
