name: CI & Quality Gate

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 1. Quality Gate & Testy Jednostkowe
    runs-on: ubuntu-latest

    steps:
      - name: 1.1 Pobranie kodu repozytorium
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 1. Sprawdź pliki wejściowe obu portali
      - name: 1.2 Sprawdzenie plików wejściowych (Kato Salsa Hub & DancePuls)
        run: |
          if [ ! -f katosalsahub.pl/index.html ] || [ ! -f katosalsahub.pl/dancepuls/index.html ]; then
            echo "❌ Brak pliku wejściowego katosalsahub.pl/index.html lub katosalsahub.pl/dancepuls/index.html!"
            exit 1
          fi

      # 2. Ochrona przed wyciekiem sekretów i skaner Gitleaks (#3)
      - name: 1.3 Ochrona przed wyciekiem sekretów (.env, secrets.php, .htpasswd)
        run: |
          if git ls-files | grep -E "(\.env|config/secrets\.php|\.htpasswd)$"; then
            echo "❌ Wykryto plik z wrażliwymi danymi w repozytorium!"
            exit 1
          fi

      - name: 1.4 Skaner sekretów Gitleaks (Wzorzec Gal Anonim)
        run: |
          GITLEAKS_VERSION="8.24.0"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --config .gitleaks.toml --verbose --redact

      # 3. Walidacja składni PHP
      - name: 1.5 Walidacja składni PHP
        run: |
          if find . -type f -name "*.php" | grep -q .; then
            echo "Sprawdzanie składni PHP..."
            find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l
          else
            echo "Brak plików PHP, pomijanie walidacji PHP."
          fi

      # 4. Konfiguracja Node.js
      - name: 1.6 Konfiguracja środowiska Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 5. Weryfikacja składni JavaScript
      - name: 1.7 Weryfikacja składni JavaScript
        run: npm run check:syntax

      # 6. Sprawdzanie integralności relatywnych linków i zasobów
      - name: 1.8 Sprawdzanie referencji lokalnych linków i zasobów
        run: |
          for dir in katosalsahub.pl katosalsahub.pl/dancepuls; do
            echo "🔍 Sprawdzanie referencji w $dir..."
            for html_file in $dir/*.html; do
              [ -f "$html_file" ] || continue
              base=$(dirname "$html_file")
              grep -oP '(?:src|href)="(?!https?://|#|javascript:|mailto:|tel:)([^"]+)"' "$html_file" | \
              sed 's/.*="\(.*\)"/\1/' | sed 's/[?#].*//' | \
              while read -r ref; do
                [ -z "$ref" ] && continue
                if [ ! -f "$base/$ref" ] && [ ! -d "$base/$ref" ]; then
                  echo "❌ BRAK ZASOBU: $html_file → $ref"
                  exit 1
                fi
              done
            done
          done
          echo "✅ Sprawdzanie referencji zakończone pomyślnie."

      # 7. Testy jednostkowe z raportem pokrycia (node:test)
      - name: 1.9 Uruchomienie testów jednostkowych (node:test)
        run: npm test -- --experimental-test-coverage

  smoke-test:
    name: 2. UI Smoke Test (Headless Browser)
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: 2.1 Pobranie kodu repozytorium
        uses: actions/checkout@v7

      - name: 2.2 Konfiguracja środowiska Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 2.3 Instalacja silnika przeglądarki Playwright (Chromium)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: 2.4 Uruchomienie testu dymnego UI
        run: npm run test:smoke

      - name: 2.5 Upload diagnostyki przy awarii (zrzuty ekranu i logi)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-diagnostics
          path: smoke-diagnostics/
          retention-days: 3

  lighthouse:
    name: 3. Audyt Lighthouse CI (a11y, SEO, Best Practices)
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: 3.1 Pobranie kodu repozytorium
        uses: actions/checkout@v7

      - name: 3.2 Konfiguracja środowiska Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 3.3 Audyt jakościowy Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './.lighthouserc.json'
